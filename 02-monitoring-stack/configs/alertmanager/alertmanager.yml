global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 1h
  receiver: 'discord'

receivers:
  - name: 'discord'
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/PASTE_WEBHOOK_URL_DISINI'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}**Alert:** {{ .Annotations.summary }}
**Server:** {{ .Labels.instance }}
**Severity:** {{ .Labels.severity }}
**Detail:** {{ .Annotations.description }}
{{ end }}'