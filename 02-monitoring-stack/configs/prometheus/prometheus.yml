global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['10.235.102.3:9100']
        labels:
          instance: 'proxy-server'
          role:     'proxy'
      - targets: ['10.235.102.4:9100']
        labels:
          instance: 'app-server'
          role:     'app'
      - targets: ['10.235.102.5:9100']
        labels:
          instance: 'db-server'
          role:     'database'
      - targets: ['10.235.102.6:9100']
        labels:
          instance: 'monitoring-server'
          role:     'monitoring'